<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ThinkLate — Video 1 Visual Storyboard & Presentation Preview</title>
  <style>
    :root {
      --ink: #1B2A4A;
      --ink-soft: #24365C;
      --paper: #F4F1EA;
      --slate: #98A2B3;
      --amber: #D99A2B;
      --brick: #9B3A2F;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0F172A; color: var(--paper); display: flex; height: 100vh; overflow: hidden; }
    
    /* Left: Visual Player (16:9 Cinema) */
    .player-section { flex: 1.6; display: flex; flex-direction: column; background: #090E17; padding: 24px; border-right: 1px solid #1E293B; }
    .stage-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .channel-badge { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: var(--amber); text-transform: uppercase; }
    .video-title { font-size: 18px; font-weight: 600; color: var(--paper); }
    .view-counter { font-size: 13px; color: var(--slate); font-family: monospace; }

    .viewport-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #334155;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .viewport-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transform-origin: center center;
    }
    @keyframes kenBurns {
      0% { transform: scale(1.0); }
      100% { transform: scale(1.08); }
    }
    .ken-burns {
      animation: kenBurns 35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
      padding: 12px 16px;
      background: #111C30;
      border-radius: 8px;
      border: 1px solid #1E2E4E;
    }
    .btn-group { display: flex; gap: 10px; align-items: center; }
    button {
      background: var(--ink-soft);
      color: var(--paper);
      border: 1px solid var(--slate);
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: var(--amber); color: #000; border-color: var(--amber); }
    button.primary { background: var(--amber); color: #000; border-color: var(--amber); }
    button.primary:hover { background: #E5A93C; }
    button.voice-active { background: #10B981; color: #FFF; border-color: #10B981; }
    
    .timeline-scrubber { flex: 1; margin: 0 24px; display: flex; flex-direction: column; gap: 6px; }
    .scrubber-bar {
      width: 100%;
      height: 6px;
      background: #1E293B;
      border-radius: 3px;
      position: relative;
      cursor: pointer;
    }
    .scrubber-fill {
      height: 100%;
      background: var(--amber);
      border-radius: 3px;
      width: 8%;
      transition: width 0.2s;
    }

    /* Right: Narration & Cue Prompter */
    .prompter-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #121E36;
      padding: 24px;
      overflow-y: auto;
    }
    .scene-meta-card {
      background: var(--ink-soft);
      padding: 16px;
      border-radius: 8px;
      border-left: 4px solid var(--amber);
      margin-bottom: 20px;
    }
    .scene-id { font-size: 13px; font-weight: 700; color: var(--amber); font-family: monospace; letter-spacing: 1px; }
    .tone-badge { display: inline-block; background: #1B2A4A; color: var(--paper); padding: 4px 10px; border-radius: 4px; font-size: 12px; margin-top: 6px; font-style: italic; border: 1px solid #3B4E7A; }
    
    .dialogue-box {
      background: #0B1324;
      padding: 24px;
      border-radius: 8px;
      border: 1px solid #1F2E4D;
      margin-bottom: 20px;
      flex: 1;
    }
    .dialogue-title { font-size: 12px; font-weight: 700; color: var(--slate); letter-spacing: 1.5px; margin-bottom: 12px; text-transform: uppercase; }
    .dialogue-text { font-size: 20px; line-height: 1.6; color: #FFF; white-space: pre-line; }
    .dialogue-text b { color: var(--amber); font-weight: 600; }
    
    .evidence-box {
      background: #172642;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #2B3D66;
    }
    .evidence-title { font-size: 12px; font-weight: 700; color: var(--amber); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; }
    .evidence-desc { font-size: 14px; color: var(--paper); line-height: 1.5; }
    .citation-code { font-family: monospace; font-size: 12px; color: var(--slate); margin-top: 6px; display: block; }
  </style>
</head>
<body>

  <div class="player-section">
    <div class="stage-header">
      <div>
        <div class="channel-badge">ThinkLate · Production Preview</div>
        <div class="video-title">01 — Is AI a Bubble? Ask the Railways</div>
      </div>
      <div class="view-counter" id="sceneCounter">SCENE 01 / 13</div>
    </div>

    <div class="viewport-container">
      <img id="stageImage" src="assets/A1_datacenter_exterior.png" alt="Scene Visual">
    </div>

    <div class="player-controls">
      <div class="btn-group">
        <button onclick="prevScene()">◀ Prev</button>
        <button class="primary" id="playBtn" onclick="toggleAutoPlay()">▶ Play Full Video</button>
        <button onclick="nextScene()">Next ▶</button>
        <button id="voiceBtn" class="voice-active" onclick="toggleVoice()">🔊 Voice: ON</button>
      </div>
      <div class="timeline-scrubber">
        <div class="scrubber-bar" onclick="scrubTimeline(event)">
          <div class="scrubber-fill" id="scrubberFill"></div>
        </div>
      </div>
      <div class="view-counter" id="durationEst">~5.5 min total</div>
    </div>
  </div>

  <div class="prompter-section">
    <div class="scene-meta-card">
      <div class="scene-id" id="sceneTag">[TAKE 1] · {S1}</div>
      <div class="tone-badge" id="toneTag">TONE: Low, conversational, conspiratorial</div>
    </div>

    <div class="dialogue-box">
      <div class="dialogue-title">Spoken Narration (Hinglish Audio)</div>
      <div class="dialogue-text" id="dialogueText"></div>
    </div>

    <div class="evidence-box">
      <div class="evidence-title">Visual Evidence & Lower-Third Trigger</div>
      <div class="evidence-desc" id="evidenceDesc"></div>
      <div class="citation-code" id="citationCode"></div>
    </div>
  </div>

  <script>
    const scenes = [
      {
        id: "[TAKE 1] · {S1}",
        tone: "Low, conversational, conspiratorial. You noticed something at work.",
        image: "assets/A1_datacenter_exterior.png",
        dialogue: "Your company has probably announced an AI budget too. //\nSome new tool // some new platform // or some big \"AI-first\" strategy. ///\n\nAnd nobody has really explained where the money is actually coming from. //\nOr what happens // when it stops. ////",
        evidence: "Base Still: A1 Modern Hyperscale Data Center Exterior at dusk. Atmospheric mist, glowing cooling vents. Slow 2% push in.",
        citation: "Visual Cold Open — Clean frame, zero distraction"
      },
      {
        id: "[TAKE 2] · {S2}",
        tone: "Direct, confident. Making the core promise.",
        image: "assets/S04_title.png",
        dialogue: "Over the next seven minutes // I want to show you something that will help you spot this // every single time // whenever something like this happens in the future. ///\n\nThat a technology being <b>\"real\"</b> // and being a <b>\"bubble\"</b> // are not two opposite things. ///\nThe exact same boom can be both. ///\nThis has happened before. // It is fully documented. ////",
        evidence: "Holding Frame: Title card typography 'REAL, BUT RUINED' / 'IS AI A BUBBLE? ASK THE RAILWAYS'.",
        citation: "Core thesis frame: Both real infrastructure and capital ruin simultaneously"
      },
      {
        id: "[TAKE 3] · {S3}",
        tone: "Grounded, personal. Shifting from abstract tech to viewer's pay.",
        image: "assets/A2_tech_workspace.png",
        dialogue: "And this isn't just a headache for shareholders. //\nYou probably don't even own a single share. ///\n\nBut if you work on a monthly salary // you are already part of this game. //\nNot through stock ownership. // Through your <b>job</b>. ////",
        evidence: "Base Still: A2 Minimalist modern corporate workspace desk at twilight with laptop chart glow.",
        citation: "Macro-to-Personal pivot: Why salaried employees carry the ultimate depreciation bill"
      },
      {
        id: "[TAKE 4] · {S4}",
        tone: "Deadpan pivot. Cutting through corporate noise into history.",
        image: "assets/S04_evidence_ssrn_mania.png",
        dialogue: "So // let's look at the railways. ////\n\nMid-nineteenth century // Britain. //\nThe railway was a brand new technology. // Truly revolutionary. //\nAnd the entire country started pouring money into it. ///\n\nProfessor Andrew Odlyzko // (pron: OD-liz-ko) // of the University of Minnesota // who has done the most detailed research on this period // calls it // quote //\n<b>\"the greatest technology mania in history.\"</b> ///\n\nUnquote. // Greatest. // In all of history. ////",
        evidence: "Paper Evidence: Authentic SSRN 1537338 abstract screenshot with yellow highlight on 'greatest technology mania in history'. Lower-third pops up at 1.0s.",
        citation: "SSRN 1537338: Prof. Andrew Odlyzko, University of Minnesota (2010)"
      },
      {
        id: "[TAKE 5] · {S5}",
        tone: "Stunned gravity. Do not rush. Let the 15–20% GDP scale sink in.",
        image: "assets/evidence_gdp_odlyzko.png",
        dialogue: "Just to understand the scale // here is one number. ///\n\nAcross Britain's two railway manias // the total capital investment reached //\n<b>fifteen to twenty percent</b> // of the entire country's GDP. ///\n\nAnd pay close attention here // this was not some paper valuation on the stock market. //\nOdlyzko specifically points out // this was actual cash // that investors handed over. ///\n\nIn today's money // that would be like the UK spending three hundred to four hundred billion pounds. //\nOr the US spending three to four trillion dollars. ////",
        evidence: "Macroeconomic Evidence: Odlyzko (2024) Page 2 showing London Stock Exchange 1860-1870 chart with Overend Gurney collapse arrow and highlighted paragraph.",
        citation: "Odlyzko (2024), p. 2: Capital investments of 15 to 20% of GDP"
      },
      {
        id: "[TAKE 6] · {S6}",
        tone: "Sharp, analytical. Revealing that the collapse was predicted.",
        image: "assets/S06_evidence_ssrn_measures.png",
        dialogue: "Now // this is where it gets really interesting. ///\n\nNobody was hiding the truth. // The data was not a secret. ///\nOdlyzko writes that // quote // <b>\"trustworthy quantitative measures\"</b> // actually existed at the time // clearly showing that real passenger and freight demand would never match the crazy profits being promised. ///\n\nThe numbers were <b>there</b>. // They were available. ///\nAnd people ignored them. // For years. ////",
        evidence: "Paper Evidence: SSRN paper abstract highlight: 'There were trustworthy quantitative measures to show investors... demand would not be enough...'",
        citation: "SSRN 1537338: Quantifiable Demand vs Speculative Exuberance"
      },
      {
        id: "[TAKE 7] · {S7}",
        tone: "Quiet dry sarcasm. Even history's sharpest intellects got blinded.",
        image: "assets/S07_evidence_historical_share.png",
        dialogue: "And this wasn't just some gullible crowd. ///\n\nThe people putting in their money included Charles Darwin. //\nJohn Stuart Mill // who was literally one of the greatest economists of his time. //\nAnd the Bronte sisters // (pron: BRON-tay). ///\n\nOdlyzko uses a phrase for this // that really sticks in your mind // quote //\n<b>\"a collective hallucination.\"</b> ///\n\nSmart people. // Clear data. // And they still fell for it. ////",
        evidence: "Primary Archive: 1845 Victorian Railway Share Subscription Archive callout cards for Charles Darwin, J.S. Mill, and the Brontë sisters.",
        citation: "British Parliamentary Papers & Bank of England Archives (1845–1846)"
      },
      {
        id: "[TAKE 8] · {S8}",
        tone: "Decisive payoff. The core thesis delivered calmly.",
        image: "assets/S08_evidence_disaster_utility.png",
        dialogue: "So the crash arrived. // And then what happened? ///\n\nRemember this one line. // It comes straight from Odlyzko's research. // Quote //\nthe railway mania // <b>\"turned out to be an investment disaster // but provided the country with a nationwide communication network of great utility.\"</b> ///\n\nThink about that for a second. ///\nInvestors were wiped out. ///\nThe tracks survived. // And trains kept running. ////",
        evidence: "The Invariant: Real paper conclusion highlighted: 'investment disaster, but provided a nationwide network of great utility'. Visual subscribe badge pops up.",
        citation: "Odlyzko (2024), Introduction, p. 1: Ruined Capital vs Surviving Infrastructure"
      },
      {
        id: "[TAKE 9] · {S9}",
        tone: "Clear, authoritative summary. Nailing the pattern down.",
        image: "assets/S09_lt_pattern.png",
        dialogue: "This is the exact pattern I want you to remember. ///\n\nAn infrastructure boom // built on outside capital //\ncan leave behind a lasting <b>asset</b> // while completely destroying the <b>investor</b>. ///\n\nThe tracks survived. // The shareholders didn't. ////",
        evidence: "Pattern Card: Dark slate navy visual with bold amber rule: 'THE INVARIANT: Overbuilt Infrastructure vs Vanished Capital'.",
        citation: "ThinkLate Invariant Formula: Asset Survival vs Capital Vaporization"
      },
      {
        id: "[TAKE 10] · {S10}",
        tone: "Thoughtful, nuanced. Unraveling the counter-intuitive twist.",
        image: "assets/S10_evidence_1830s_paradox.png",
        dialogue: "And this is the part where I have to pause. ////\n\nBecause there is another detail // that makes this question genuinely difficult to answer. ///\n\nBefore the big railway mania // back in the eighteen-thirties // there was a smaller mania. // It crashed too. // Everyone called it a bubble. ///\n\nExcept // Odlyzko writes that a few years later // people realized it had // quote //\n<b>\"collapsed prematurely\"</b> // because the projects started during that crazy phase actually succeeded in the long run. ///\n\nIn other words // a bubble that turned out not to be irrational after all. ////",
        evidence: "Historical Paradox: SSRN abstract highlighted: 'collapsed prematurely, as projects started during its exuberant phase became successful'.",
        citation: "SSRN 1537338: The 1830s Mania and the Difficulty of Identifying True Irrationality"
      },
      {
        id: "[TAKE 11] · {S11}",
        tone: "Frank, transparent, intellectual honesty. Admitting what is guess vs fact.",
        image: "assets/S11_evidence_goldman_report.png",
        dialogue: "So // what about today's AI boom? ///\n\nHere // I am making an <b>inference</b>. // This is not a proven historical fact. //\nI haven't gone through every corporate balance sheet myself. // And I will always be transparent when I am sharing a hypothesis. ///\n\nIn eighteen-forty-five // the path to ruin was straightforward. //\nEveryday retail investors // paying small down-payments on shares // and getting wiped out by cash calls they couldn't afford. ///\n\nToday's AI buildout // is being funded by just a handful of massive tech giants out of their own balance sheets. //\nSo where the real risk eventually lands // nobody knows for sure yet. ///\nAnd <b>that</b> is the actual question. ////",
        evidence: "Modern Wall Street Research: Goldman Sachs Global Investment Research ('Gen AI: Too Much Spend, Too Little Benefit?') + Pinned Inference Disclaimer.",
        citation: "Goldman Sachs Top of Mind (June 2024) / Jim Covello Capex Analysis"
      },
      {
        id: "[TAKE 12] · {S12}",
        tone: "Cold reality check. Connecting macro buildout to viewer's job.",
        image: "assets/S12_evidence_sequoia_chart.png",
        dialogue: "The real question isn't whether AI is a bubble or not. ///\n\nThe real question to ask // is when the spending slows down // who ends up paying the bill. ///\nSometimes it's the shareholder. //\nSometimes it's the <b>headcount</b>. ////",
        evidence: "Venture Analysis: Sequoia Capital ('AI\'s $600B Question') chart showing Capex vs Realized Revenue Gap. Lower-third: 'Shareholder vs Headcount'.",
        citation: "Sequoia Capital Analysis (David Cahn): The $600B AI Revenue Gap"
      },
      {
        id: "[TAKE 13] · {S13}",
        tone: "Quiet, lingering closing thought. Leaves viewer thinking.",
        image: "assets/S13_endcard.png",
        dialogue: "In eighteen-forty-five // the numbers were right there on the table. //\nEven Darwin ignored them. ///\n\nSo the question for us isn't whether this is a bubble. ///\n\nThe real question is // <b>which number</b> will actually give it away // and is anyone paying attention to it right now. ////",
        evidence: "End Card: Deep slate navy holding frame with ThinkLate wordmark. Two cleared video recommendation zones per YouTube end-screen specs.",
        citation: "Zero spoken CTA — Lingering provocative question into silent end screen"
      }
    ];

    let currentIndex = 0;
    let autoPlayActive = false;
    let voiceEnabled = true;
    const voiceAudio = new Audio();

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      const vBtn = document.getElementById('voiceBtn');
      if (voiceEnabled) {
        vBtn.innerText = "🔊 Voice: ON";
        vBtn.classList.add('voice-active');
        playCurrentVoice();
      } else {
        vBtn.innerText = "🔇 Voice: OFF";
        vBtn.classList.remove('voice-active');
        voiceAudio.pause();
      }
    }

    function playCurrentVoice() {
      if (!voiceEnabled) return;
      voiceAudio.pause();
      const takeNum = String(currentIndex + 1).padStart(2, '0');
      voiceAudio.src = `audio_takes/take_${takeNum}.mp3`;
      voiceAudio.play().catch(err => {
        console.log("Audio autoplay prevented by browser policy until user clicks Play:", err);
      });
    }

    voiceAudio.onended = () => {
      if (autoPlayActive) {
        setTimeout(() => {
          if (currentIndex < scenes.length - 1) {
            nextScene();
          } else {
            toggleAutoPlay();
          }
        }, 800);
      }
    };

    function renderScene(idx) {
      const sc = scenes[idx];
      document.getElementById('sceneCounter').innerText = `SCENE ${String(idx + 1).padStart(2, '0')} / 13`;
      
      const img = document.getElementById('stageImage');
      img.classList.remove('ken-burns');
      void img.offsetWidth; // Force CSS reflow to restart animation
      img.src = sc.image;
      img.classList.add('ken-burns');

      document.getElementById('sceneTag').innerText = sc.id;
      document.getElementById('toneTag').innerText = sc.tone;
      document.getElementById('dialogueText').innerHTML = sc.dialogue;
      document.getElementById('evidenceDesc').innerText = sc.evidence;
      document.getElementById('citationCode').innerText = sc.citation;
      document.getElementById('scrubberFill').style.width = `${((idx + 1) / scenes.length) * 100}%`;

      playCurrentVoice();
    }

    function nextScene() {
      currentIndex = (currentIndex + 1) % scenes.length;
      renderScene(currentIndex);
    }

    function prevScene() {
      currentIndex = (currentIndex - 1 + scenes.length) % scenes.length;
      renderScene(currentIndex);
    }

    function scrubTimeline(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = clickX / rect.width;
      currentIndex = Math.min(Math.floor(pct * scenes.length), scenes.length - 1);
      renderScene(currentIndex);
    }

    function toggleAutoPlay() {
      const btn = document.getElementById('playBtn');
      autoPlayActive = !autoPlayActive;
      if (autoPlayActive) {
        btn.innerText = "⏸ Pause Video";
        btn.classList.add('primary');
        playCurrentVoice();
      } else {
        btn.innerText = "▶ Play Full Video";
        btn.classList.remove('primary');
        voiceAudio.pause();
      }
    }

    // Keyboard shortcuts: Arrow keys, Space
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { nextScene(); e.preventDefault(); }
      if (e.key === 'ArrowLeft') { prevScene(); e.preventDefault(); }
      if (e.key === ' ') { toggleAutoPlay(); e.preventDefault(); }
    });

    renderScene(0);
  </script>
</body>
</html>
