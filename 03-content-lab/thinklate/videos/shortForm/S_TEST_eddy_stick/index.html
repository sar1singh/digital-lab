<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
  <title>Monkey Explains Style Owl Animation - ThinkLate</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #F4F1EA;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #111118;
      position: relative;
    }
    
    /* Background Paper Texture & Grid */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.8;
      pointer-events: none;
    }
    
    .bg-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.08) 100%);
      pointer-events: none;
    }

    /* Top Brand Badge & Header */
    .header-bar {
      position: absolute;
      top: 120px;
      left: 80px;
      right: 80px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 10;
    }
    
    .badge {
      align-self: flex-start;
      background: #111118;
      color: #E2FF00;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 10px 24px;
      border-radius: 8px;
      text-transform: uppercase;
    }
    
    .title-main {
      font-size: 76px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -2px;
      color: #111118;
      text-transform: uppercase;
    }
    
    .subtitle {
      font-size: 34px;
      font-weight: 600;
      color: #555566;
    }

    /* Character Stage (Grounded at bottom) */
    #character-stage {
      position: absolute;
      left: 80px;
      bottom: 220px;
      width: 480px;
      height: 720px;
      z-index: 20;
      transform-origin: 50% 100%;
    }

    /* Ground Contact Shadow */
    #ground-shadow {
      position: absolute;
      left: 140px;
      bottom: 210px;
      width: 360px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.22) 0%, transparent 70%);
      z-index: 18;
    }

    /* Sprite Layers (Stacked in stage) */
    .character-sprite {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      height: 680px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.12));
      opacity: 0;
      display: none;
    }

    /* Thought / Emotion Pop Badges */
    .emotion-badge {
      position: absolute;
      top: 40px;
      left: 320px;
      background: #111118;
      color: #FFFFFF;
      font-size: 48px;
      font-weight: 900;
      padding: 8px 24px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      opacity: 0;
      z-index: 25;
      transform-origin: center bottom;
    }

    /* Evidence Card (Right Side) */
    #evidence-card {
      position: absolute;
      right: 70px;
      bottom: 440px;
      width: 460px;
      background: #FFFFFF;
      border: 4px solid #111118;
      box-shadow: 14px 18px 0px rgba(0, 0, 0, 0.16);
      padding: 36px;
      border-radius: 14px;
      z-index: 15;
      opacity: 0;
    }
    
    .card-label {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #888899;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    
    .card-fee {
      font-size: 72px;
      font-weight: 900;
      color: #FF2A4B;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    
    .card-desc {
      font-size: 28px;
      font-weight: 600;
      color: #333344;
      line-height: 1.35;
    }

    /* Rubber Stamp */
    #stamp-banned {
      position: absolute;
      top: 50%;
      left: 50%;
      border: 6px dashed #FF2A4B;
      color: #FF2A4B;
      font-size: 46px;
      font-weight: 900;
      padding: 14px 30px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 4px;
      opacity: 0;
      pointer-events: none;
    }

    /* Bottom Status Pill */
    .status-pill {
      position: absolute;
      bottom: 80px;
      left: 80px;
      right: 80px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(0, 0, 0, 0.08);
      border-radius: 16px;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    
    .pill-text {
      font-size: 30px;
      font-weight: 700;
      color: #111118;
    }
    
    .pill-phase {
      font-size: 28px;
      font-weight: 800;
      color: #111118;
      background: #E2FF00;
      padding: 8px 20px;
      border-radius: 20px;
    }
  </style>
</head>
<body data-composition-id="main" data-width="1080" data-height="1920" data-duration="8">
  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>

  <!-- Declarative Audio Tracks for HyperFrames -->
  <audio src="assets/whoosh_air_soft.mp3" data-start="0.0" data-duration="1.2"></audio>
  <audio src="assets/camera_classic_click.mp3" data-start="1.8" data-duration="0.6"></audio>
  <audio src="assets/paper_slide_document.mp3" data-start="3.4" data-duration="1.0"></audio>
  <audio src="assets/sub_impact_warm_knocking.mp3" data-start="5.0" data-duration="1.5"></audio>

  <!-- Header -->
  <div class="header-bar">
    <div class="badge">ThinkLate Explains</div>
    <div class="title-main">The $300<br/>Chore Tax</div>
    <div class="subtitle">Why you are paying to vacuum your own Airbnb</div>
  </div>

  <!-- Ground Shadow -->
  <div id="ground-shadow"></div>

  <!-- Character Stage with Multi-Pose Sprites -->
  <div id="character-stage">
    <!-- Pose 1: Curious Intro -->
    <img id="pose-curious" class="character-sprite" src="assets/01_curious_clean.png" alt="Curious" />
    
    <!-- Pose 2: Huh? Confusion (Scratching ear tuft) -->
    <img id="pose-huh" class="character-sprite" src="assets/05_huh_clean.png" alt="Huh" />
    
    <!-- Pose 3: Shocked! (Eyes wide, glasses flying, panic) -->
    <img id="pose-shocked" class="character-sprite" src="assets/02_shocked_clean.png" alt="Shocked" />
    
    <!-- Pose 4: Angry! (Furrowed brow, pointing at fee) -->
    <img id="pose-angry" class="character-sprite" src="assets/03_angry_clean.png" alt="Angry" />
    
    <!-- Pose 5: Thinking (Analytical smirk) -->
    <img id="pose-thinking" class="character-sprite" src="assets/07_thinking_clean.png" alt="Thinking" />

    <!-- Emotion Badges -->
    <div id="badge-question" class="emotion-badge">???</div>
    <div id="badge-exclaim" class="emotion-badge" style="background:#FF2A4B;">! ! !</div>
  </div>

  <!-- Evidence Card -->
  <div id="evidence-card" data-layout-allow-overlap>
    <div class="card-label">Booking Surcharge #4092</div>
    <div class="card-fee">+$300.00</div>
    <div class="card-desc">Mandatory Deep-Clean Surcharge + Strip Bed Linens & Take Out Trash</div>
    <div id="stamp-banned">BANNED AUDIT</div>
  </div>

  <!-- Bottom Status Pill -->
  <div class="status-pill">
    <div class="pill-text">Eddy Owl: 2D Doodle Engine</div>
    <div class="pill-phase">Pose-To-Beat Active</div>
  </div>

  <!-- GSAP 3 Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline();
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;

    // Set initial static states through GSAP
    gsap.set("#evidence-card", { x: 550, rotation: 3 });
    gsap.set("#stamp-banned", { xPercent: -50, yPercent: -50, rotation: -14, scale: 2.2 });
    gsap.set("#badge-question", { scale: 0, opacity: 0 });
    gsap.set("#badge-exclaim", { scale: 0, opacity: 0 });

    // ==========================================
    // BEAT 1 (0.0s - 1.8s): ENTRANCE & CURIOUS STANCE
    // ==========================================
    tl.set("#pose-curious", { display: "block", opacity: 1 }, 0.0);

    tl.from("#character-stage", {
      y: 220,
      opacity: 0,
      duration: 0.6,
      ease: "back.out(1.8)"
    }, 0.0);

    tl.from("#ground-shadow", {
      scaleX: 0.2,
      opacity: 0,
      duration: 0.6,
      ease: "power2.out"
    }, 0.0);

    // Subtle natural breathing float
    tl.to("#character-stage", {
      y: -8,
      duration: 0.9,
      yoyo: true,
      repeat: 1,
      ease: "sine.inOut"
    }, 0.6);

    // ==========================================
    // BEAT 2 (1.8s - 3.4s): "HUH?" SCRATCHING EAR TUFT
    // ==========================================
    tl.set("#pose-curious", { display: "none", opacity: 0 }, 1.8);
    tl.set("#pose-huh", { display: "block", opacity: 1 }, 1.8);

    // Snappy spring punch on pose cut
    tl.fromTo("#character-stage", 
      { scale: 0.92, rotation: -3 },
      { scale: 1.0, rotation: 0, duration: 0.25, ease: "back.out(2.2)" },
      1.8
    );

    // Question mark badge pops out above head
    tl.to("#badge-question", {
      scale: 1,
      opacity: 1,
      duration: 0.3,
      ease: "back.out(2.5)"
    }, 1.9);

    tl.to("#badge-question", {
      scale: 0,
      opacity: 0,
      duration: 0.2,
      ease: "power2.in"
    }, 3.1);

    // ==========================================
    // BEAT 3 (3.4s - 5.0s): SHOCKED! (Eyes wide, glasses askew)
    // ==========================================
    tl.set("#pose-huh", { display: "none", opacity: 0 }, 3.4);
    tl.set("#pose-shocked", { display: "block", opacity: 1 }, 3.4);

    // Shocked jump back
    tl.fromTo("#character-stage", 
      { scale: 1.15, x: -30, y: -20 },
      { scale: 1.0, x: 0, y: 0, duration: 0.35, ease: "elastic.out(1, 0.4)" },
      3.4
    );

    // Exclamation badge slams in
    tl.to("#badge-exclaim", {
      scale: 1.2,
      opacity: 1,
      duration: 0.2,
      ease: "back.out(2.8)"
    }, 3.45);

    // Evidence Card slams in from right!
    tl.to("#evidence-card", {
      x: 0,
      opacity: 1,
      duration: 0.5,
      ease: "back.out(1.4)"
    }, 3.5);

    tl.to("#badge-exclaim", {
      scale: 0,
      opacity: 0,
      duration: 0.2
    }, 4.7);

    // ==========================================
    // BEAT 4 (5.0s - 6.6s): ANGRY POINTING AT EVIDENCE
    // ==========================================
    tl.set("#pose-shocked", { display: "none", opacity: 0 }, 5.0);
    tl.set("#pose-angry", { display: "block", opacity: 1 }, 5.0);

    // Authoritative lunge forward
    tl.fromTo("#character-stage", 
      { scale: 0.94, x: 20 },
      { scale: 1.04, x: 0, duration: 0.3, ease: "power3.out" },
      5.0
    );

    // Rubber stamp slams down on card!
    tl.to("#stamp-banned", {
      opacity: 1,
      scale: 1.0,
      duration: 0.22,
      ease: "back.out(2.4)"
    }, 5.15);

    // Card micro-shake on impact
    tl.to("#evidence-card", {
      y: -8,
      duration: 0.05,
      yoyo: true,
      repeat: 3
    }, 5.25);

    // ==========================================
    // BEAT 5 (6.6s - 8.0s): ANALYTICAL THINKING SMIRK
    // ==========================================
    tl.set("#pose-angry", { display: "none", opacity: 0 }, 6.6);
    tl.set("#pose-thinking", { display: "block", opacity: 1 }, 6.6);

    tl.fromTo("#character-stage", 
      { scale: 0.96, rotation: 2 },
      { scale: 1.0, rotation: 0, duration: 0.4, ease: "power2.out" },
      6.6
    );

    // Gentle camera push-in to conclude
    tl.to("body", {
      scale: 1.02,
      transformOrigin: "center center",
      duration: 1.4,
      ease: "sine.inOut"
    }, 6.6);
  </script>
</body>
</html>
